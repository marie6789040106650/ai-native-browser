[workspace]
members = ["core_engine", "gateway_app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AI Native Browser Team"]
license = "MIT"

[workspace.dependencies]
# Core dependencies
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

# Async runtime
async-trait = "0.1"

# HTTP server
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# HTTP client for CDP
ureq = { version = "2", features = ["json"] }

# HTML parsing
scraper = "0.25"
